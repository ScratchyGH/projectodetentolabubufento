<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root{
    --bg:#0d0d0e;
    --card:#1b1b1d;
    --card2:#232325;
    --gray:#2e2e31;
    --text:#f0f0f0;
    --sub:#9a9a9e;
    --accent:#6e6e74;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"SF Pro",Roboto,"Segoe UI",sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:22px 20px 10px;flex-shrink:0;}
  header h1{margin:0;font-size:28px;font-weight:700;}
  header p{margin:4px 0 0;color:var(--sub);font-size:14px;}
  #list{flex:1;overflow-y:auto;padding:10px 16px 100px;}
  .note{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:10px;
    display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .15s;}
  .note:active{background:var(--card2);}
  .icon{width:44px;height:44px;border-radius:14px;background:var(--gray);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .meta{flex:1;min-width:0;}
  .meta .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta .s{font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .del{color:var(--sub);font-size:20px;padding:6px;}
  #empty{color:var(--sub);text-align:center;margin-top:60px;font-size:15px;}
  #fab{position:fixed;right:22px;bottom:28px;width:58px;height:58px;border-radius:50%;
    background:var(--text);color:#111;font-size:30px;border:none;display:flex;
    align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.5);}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-radius:26px 26px 0 0;padding:14px 20px 28px;max-height:85vh;overflow-y:auto;
    transform:translateY(100%);transition:transform .25s ease;z-index:11;}
  .sheet.open{transform:translateY(0);}
  .sheet-bg.open{display:block;}
  .handle{width:40px;height:5px;background:var(--gray);border-radius:3px;margin:4px auto 16px;}
  .sheet h2{margin:0 0 14px;font-size:20px;}
  .types{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .type-btn{background:var(--gray);border:none;border-radius:16px;padding:16px;color:var(--text);
    font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .type-btn.active{background:var(--text);color:#111;}
  input[type=text],textarea{width:100%;background:var(--gray);border:none;border-radius:14px;
    color:var(--text);padding:12px 14px;font-size:15px;margin-bottom:10px;font-family:inherit;}
  textarea{resize:vertical;min-height:90px;}
  .row{display:flex;gap:10px;}
  .btn{flex:1;background:var(--gray);border:none;border-radius:14px;padding:13px;color:var(--text);
    font-size:15px;font-weight:600;}
  .btn.primary{background:var(--text);color:#111;}
  .btn:disabled{opacity:.5;}
  input[type=file]{color:var(--sub);margin-bottom:10px;}
  #viewer{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;
    flex-direction:column;}
  #viewer.open{display:flex;}
  #vhead{padding:18px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  #vhead button{background:var(--gray);border:none;color:var(--text);width:38px;height:38px;
    border-radius:50%;font-size:18px;}
  #vhead .vt{font-size:17px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #vbody{flex:1;overflow-y:auto;padding:0 18px 24px;}
  #vbody img,#vbody video{max-width:100%;border-radius:18px;display:block;margin:0 auto;}
  #vbody audio{width:100%;}
  #vbody .txt{white-space:pre-wrap;font-size:16px;line-height:1.5;}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid var(--sub);
    border-top-color:var(--text);border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Notes</h1>
    <p id="sub">Text, image, video & audio</p>
  </header>
  <div id="list"></div>
</div>
<button id="fab">+</button>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <h2>New Note</h2>
  <div class="types" id="types">
    <button class="type-btn active" data-type="text">📝 Text</button>
    <button class="type-btn" data-type="image">🖼️ Image</button>
    <button class="type-btn" data-type="video">🎬 Video</button>
    <button class="type-btn" data-type="audio">🎵 Audio</button>
  </div>
  <input type="text" id="titleInput" placeholder="Title">
  <div id="fields"></div>
  <div class="row">
    <button class="btn" id="cancelBtn">Cancel</button>
    <button class="btn primary" id="saveBtn">Save</button>
  </div>
</div>

<div id="viewer">
  <div id="vhead"><button id="vback">←</button><div class="vt" id="vtitle"></div><button id="vdel">🗑</button></div>
  <div id="vbody"></div>
</div>

<script>
const KEY='notes_v1';
let notes=[];
let curType='text';

const list=document.getElementById('list');
const sheet=document.getElementById('sheet');
const sheetBg=document.getElementById('sheetBg');
const fields=document.getElementById('fields');
const viewer=document.getElementById('viewer');

function openSheet(){sheetBg.classList.add('open');sheet.classList.add('open');renderFields();}
function closeSheet(){sheetBg.classList.remove('open');sheet.classList.remove('open');}
document.getElementById('fab').onclick=openSheet;
document.getElementById('cancelBtn').onclick=closeSheet;
sheetBg.onclick=closeSheet;

document.getElementById('types').onclick=e=>{
  const b=e.target.closest('.type-btn'); if(!b) return;
  [...document.querySelectorAll('.type-btn')].forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); curType=b.dataset.type; renderFields();
};

function renderFields(){
  if(curType==='text'){
    fields.innerHTML=`
      <textarea id="textContent" placeholder="Write your note..."></textarea>
      <div class="row">
        <input type="text" id="aiPrompt" placeholder="AI prompt (optional)">
        <button class="btn" id="aiGenBtn" style="flex:0 0 90px">✨ AI</button>
      </div>`;
    document.getElementById('aiGenBtn').onclick=async()=>{
      const p=document.getElementById('aiPrompt').value.trim(); if(!p) return;
      const btn=document.getElementById('aiGenBtn'); btn.innerHTML='<span class="spin"></span>';
      try{
        const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(p));
        const t=await r.text();
        document.getElementById('textContent').value=t;
      }catch(e){alert('AI request failed');}
      btn.innerHTML='✨ AI';
    };
  } else if(curType==='image'){
    fields.innerHTML=`
      <input type="text" id="imgPrompt" placeholder="Describe image to generate...">
      <div class="row">
        <button class="btn primary" id="imgGenBtn">✨ Generate with AI</button>
      </div>
      <p style="color:var(--sub);font-size:13px;margin:10px 0 4px">or upload</p>
      <input type="file" id="fileInput" accept="image/*">
      <img id="preview" style="max-width:100%;border-radius:14px;margin-top:8px;display:none">`;
    document.getElementById('imgGenBtn').onclick=()=>{
      const p=document.getElementById('imgPrompt').value.trim(); if(!p) return;
      const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=768&height=768&nologo=true';
      const img=document.getElementById('preview'); img.src=url; img.style.display='block';
      img.dataset.generated=url;
    };
    document.getElementById('fileInput').onchange=e=>handleFile(e,'preview','img');
  } else if(curType==='video'){
    fields.innerHTML=`
      <input type="file" id="fileInput" accept="video/*">
      <video id="preview" style="max-width:100%;border-radius:14px;margin-top:8px;display:none" controls></video>`;
    document.getElementById('fileInput').onchange=e=>handleFile(e,'preview','video');
  } else {
    fields.innerHTML=`
      <input type="file" id="fileInput" accept="audio/*">
      <audio id="preview" style="width:100%;margin-top:8px;display:none" controls></audio>`;
    document.getElementById('fileInput').onchange=e=>handleFile(e,'preview','audio');
  }
}

function handleFile(e,previewId,kind){
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const el=document.getElementById(previewId);
    el.src=reader.result; el.style.display='block'; el.dataset.data=reader.result;
  };
  reader.readAsDataURL(f);
}

document.getElementById('saveBtn').onclick=async()=>{
  const title=document.getElementById('titleInput').value.trim()||'Untitled';
  let content='', note={id:Date.now().toString(),type:curType,title,createdAt:Date.now()};

  if(curType==='text'){
    content=document.getElementById('textContent').value;
    if(!content.trim()){alert('Note is empty');return;}
    note.content=content;
  } else {
    const prev=document.getElementById('preview');
    const data = (curType==='image' && prev.dataset.generated) ? prev.dataset.generated : prev.dataset.data;
    if(!data){alert('Add a file or generate one');return;}
    note.content=data;
  }
  notes.unshift(note);
  await save();
  render();
  document.getElementById('titleInput').value='';
  closeSheet();
};

function render(){
  list.innerHTML='';
  if(!notes.length){ list.innerHTML='<div id="empty">No notes yet. Tap + to add one.</div>'; return; }
  const icons={text:'📝',image:'🖼️',video:'🎬',audio:'🎵'};
  notes.forEach(n=>{
    const div=document.createElement('div'); div.className='note';
    div.innerHTML=`<div class="icon">${icons[n.type]}</div>
      <div class="meta"><div class="t">${escapeHtml(n.title)}</div>
      <div class="s">${n.type} · ${new Date(n.createdAt).toLocaleDateString()}</div></div>`;
    div.onclick=()=>openViewer(n.id);
    list.appendChild(div);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let activeId=null;
function openViewer(id){
  const n=notes.find(x=>x.id===id); if(!n) return;
  activeId=id;
  document.getElementById('vtitle').textContent=n.title;
  const body=document.getElementById('vbody');
  if(n.type==='text') body.innerHTML=`<div class="txt">${escapeHtml(n.content)}</div>`;
  else if(n.type==='image') body.innerHTML=`<img src="${n.content}">`;
  else if(n.type==='video') body.innerHTML=`<video src="${n.content}" controls></video>`;
  else body.innerHTML=`<div style="margin-top:40px"><audio src="${n.content}" controls></audio></div>`;
  viewer.classList.add('open');
}
document.getElementById('vback').onclick=()=>viewer.classList.remove('open');
document.getElementById('vdel').onclick=async()=>{
  notes=notes.filter(n=>n.id!==activeId);
  await save(); render(); viewer.classList.remove('open');
};

async function save(){
  try{ await puter.kv.set(KEY, JSON.stringify(notes)); }
  catch(e){ localStorage.setItem(KEY, JSON.stringify(notes)); }
}
async function load(){
  try{
    const v=await puter.kv.get(KEY);
    notes = v ? JSON.parse(v) : [];
  }catch(e){
    const v=localStorage.getItem(KEY);
    notes = v ? JSON.parse(v) : [];
  }
  render();
}
load();
</script>
</body>
</html>
